<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8d8ce" />
    <meta
      name="description"
      content="Interactive WebGPU wind-field ribbons for Three.js."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23e8f0e9' stroke='%23193632' stroke-width='3'/%3E%3Cpath d='M12 32c8-9 12 9 20 0s12 9 20 0' fill='none' stroke='%23193632' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>three-windline</title>
  </head>
  <body>
    <main id="app" aria-label="Interactive wind field">
      <div id="viewport" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="/" aria-label="three-windline home">
          <span class="brand-mark"></span>
          <span class="brand-name">three-windline</span>
          <span class="brand-version">v0.3</span>
        </a>

        <div class="preset-switcher" role="group" aria-label="Wind field preset">
          <button class="preset-button is-active" type="button" data-preset="breeze">
            Breeze
          </button>
          <button class="preset-button" type="button" data-preset="tornado">
            Wind
          </button>
          <button class="preset-button" type="button" data-preset="water">
            Water
          </button>
          <button class="preset-button" type="button" data-preset="fire">
            Fire
          </button>
          <button class="preset-button" type="button" data-preset="storm">
            Storm Front
          </button>
        </div>

        <nav class="command-bar" aria-label="Scene controls">
          <button
            id="pauseButton"
            class="icon-button"
            type="button"
            aria-label="Pause simulation"
            data-tooltip="Pause"
          >
            <i data-lucide="pause" aria-hidden="true"></i>
          </button>
          <button
            id="resetButton"
            class="icon-button"
            type="button"
            aria-label="Reset view"
            data-tooltip="Reset view"
          >
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </button>
          <button
            id="settingsButton"
            class="icon-button"
            type="button"
            aria-label="Open settings"
            aria-controls="settingsDrawer"
            aria-expanded="false"
            data-tooltip="Settings"
          >
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
          </button>
        </nav>
      </header>

      <aside id="settingsDrawer" class="settings-drawer" aria-label="Wind settings" hidden>
        <div class="drawer-heading">
          <div>
            <p class="eyebrow">Live parameters</p>
            <h1>Wind field</h1>
          </div>
          <button
            id="closeSettingsButton"
            class="icon-button icon-button-dark"
            type="button"
            aria-label="Close settings"
            data-tooltip="Close"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="settings-scroll">
          <section class="settings-section" aria-labelledby="flowSettingsTitle">
            <h2 id="flowSettingsTitle">Flow</h2>
            <div class="range-control">
              <label for="densitySlider">Density</label>
              <output id="densityValue" for="densitySlider">160</output>
              <input id="densitySlider" type="range" min="24" max="720" step="8" value="160" />
            </div>
            <div class="range-control">
              <label for="speedSlider">Speed</label>
              <output id="speedValue" for="speedSlider">1.00×</output>
              <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="1" />
            </div>
            <div class="range-control">
              <label for="gustSlider">Gust</label>
              <output id="gustValue" for="gustSlider">5.5 m/s</output>
              <input id="gustSlider" type="range" min="0" max="20" step="0.5" value="5.5" />
            </div>
          </section>

          <section
            id="vortexSettings"
            class="settings-section"
            aria-labelledby="vortexSettingsTitle"
            hidden
          >
            <h2 id="vortexSettingsTitle">Vortex form</h2>
            <div class="range-control">
              <label for="heightSlider">Height</label>
              <output id="heightValue" for="heightSlider">26.0 m</output>
              <input id="heightSlider" type="range" min="16" max="38" step="0.5" value="26" />
            </div>
            <div class="range-control">
              <label for="topRadiusSlider">Crown radius</label>
              <output id="topRadiusValue" for="topRadiusSlider">9.6 m</output>
              <input
                id="topRadiusSlider"
                type="range"
                min="5"
                max="15"
                step="0.2"
                value="9.6"
              />
            </div>
            <div class="range-control">
              <label for="axisBendSlider">Axis bend</label>
              <output id="axisBendValue" for="axisBendSlider">1.00×</output>
              <input
                id="axisBendSlider"
                type="range"
                min="0"
                max="2"
                step="0.05"
                value="1"
              />
            </div>
            <div class="range-control">
              <label for="axisWanderSlider">Axis wander</label>
              <output id="axisWanderValue" for="axisWanderSlider">1.45 m</output>
              <input
                id="axisWanderSlider"
                type="range"
                min="0"
                max="3"
                step="0.05"
                value="1.45"
              />
            </div>
            <div class="range-control">
              <label for="volumeSlider">Volume</label>
              <output id="volumeValue" for="volumeSlider">100%</output>
              <input
                id="volumeSlider"
                type="range"
                min="0"
                max="1.5"
                step="0.05"
                value="1"
              />
            </div>
          </section>

          <section class="settings-section" aria-labelledby="ribbonSettingsTitle">
            <h2 id="ribbonSettingsTitle">Ribbon</h2>
            <div class="range-control">
              <label for="lengthSlider">Length</label>
              <output id="lengthValue" for="lengthSlider">18.0 m</output>
              <input id="lengthSlider" type="range" min="6" max="42" step="0.5" value="18" />
            </div>
            <div class="range-control">
              <label for="widthSlider">Width</label>
              <output id="widthValue" for="widthSlider">1.4 px</output>
              <input id="widthSlider" type="range" min="0.6" max="8" step="0.1" value="1.4" />
            </div>
            <div class="range-control">
              <label for="opacitySlider">Opacity</label>
              <output id="opacityValue" for="opacitySlider">34%</output>
              <input id="opacitySlider" type="range" min="0.08" max="0.92" step="0.01" value="0.34" />
            </div>
          </section>

          <section class="settings-section" aria-labelledby="curveSettingsTitle">
            <h2 id="curveSettingsTitle">Curve program</h2>
            <label class="select-control">
              <span>Family</span>
              <select id="curveSelect">
                <option value="flow">Flow</option>
                <option value="straight">Straight</option>
                <option value="arc">Arc</option>
                <option value="ring">Ring</option>
                <option value="helix">Helix</option>
                <option value="spiral">Spiral</option>
              </select>
            </label>
            <div class="range-control">
              <label for="curveSweepSlider">Arc sweep</label>
              <output id="curveSweepValue" for="curveSweepSlider">180°</output>
              <input
                id="curveSweepSlider"
                type="range"
                min="20"
                max="360"
                step="1"
                value="180"
              />
            </div>
            <div class="range-control">
              <label for="curveTurnsSlider">Turns</label>
              <output id="curveTurnsValue" for="curveTurnsSlider">1.50</output>
              <input
                id="curveTurnsSlider"
                type="range"
                min="0.25"
                max="6"
                step="0.05"
                value="1.5"
              />
            </div>
          </section>

          <section class="settings-section" aria-labelledby="colorSettingsTitle">
            <h2 id="colorSettingsTitle">Color</h2>
            <div class="range-control">
              <label for="colorRandomnessSlider">Instance random</label>
              <output id="colorRandomnessValue" for="colorRandomnessSlider">18%</output>
              <input
                id="colorRandomnessSlider"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="0.18"
              />
            </div>
          </section>
        </div>
      </aside>

      <section class="telemetry" aria-label="Renderer statistics">
        <div id="backendState" class="backend-state">
          <span class="status-dot"></span>
          <span id="backendLabel">Initializing</span>
        </div>
        <dl>
          <div>
            <dt>FPS</dt>
            <dd id="fpsValue">--</dd>
          </div>
          <div>
            <dt>DRAW</dt>
            <dd id="drawValue">--</dd>
          </div>
          <div>
            <dt>LINES</dt>
            <dd id="lineValue">--</dd>
          </div>
        </dl>
      </section>

      <div class="field-readout" aria-live="polite">
        <span id="fieldIndex">01</span>
        <div>
          <strong id="fieldName">Breeze</strong>
          <span id="fieldMetric">6.8 m/s · uniform</span>
        </div>
      </div>

      <div id="loading" class="loading-screen" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p>Compiling wind field</p>
      </div>

      <div id="fatalError" class="fatal-error" role="alert" hidden>
        <i data-lucide="triangle-alert" aria-hidden="true"></i>
        <strong>Renderer unavailable</strong>
        <p id="fatalErrorMessage"></p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
