<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#b8d8ce" />
    <meta
      name="description"
      content="Interactive WebGPU wind-field ribbons for Three.js."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='29' fill='%23e8f0e9' stroke='%23193632' stroke-width='3'/%3E%3Cpath d='M12 32c8-9 12 9 20 0s12 9 20 0' fill='none' stroke='%23193632' stroke-width='4' stroke-linecap='round'/%3E%3C/svg%3E"
    />
    <title>three-windline</title>
  </head>
  <body>
    <main id="app" aria-label="Interactive wind field">
      <div id="viewport" aria-hidden="true"></div>

      <header class="topbar">
        <a class="brand" href="/" aria-label="three-windline home">
          <span class="brand-mark"></span>
          <span class="brand-name">three-windline</span>
          <span class="brand-version">v0.1</span>
        </a>

        <div class="preset-switcher" role="group" aria-label="Wind field preset">
          <button class="preset-button is-active" type="button" data-preset="breeze">
            Breeze
          </button>
          <button class="preset-button" type="button" data-preset="shear">
            Canyon Shear
          </button>
          <button class="preset-button" type="button" data-preset="tornado">
            Tornado
          </button>
          <button class="preset-button" type="button" data-preset="storm">
            Storm Front
          </button>
        </div>

        <nav class="command-bar" aria-label="Scene controls">
          <button
            id="pauseButton"
            class="icon-button"
            type="button"
            aria-label="Pause simulation"
            data-tooltip="Pause"
          >
            <i data-lucide="pause" aria-hidden="true"></i>
          </button>
          <button
            id="resetButton"
            class="icon-button"
            type="button"
            aria-label="Reset view"
            data-tooltip="Reset view"
          >
            <i data-lucide="rotate-ccw" aria-hidden="true"></i>
          </button>
          <button
            id="settingsButton"
            class="icon-button"
            type="button"
            aria-label="Open settings"
            aria-controls="settingsDrawer"
            aria-expanded="false"
            data-tooltip="Settings"
          >
            <i data-lucide="sliders-horizontal" aria-hidden="true"></i>
          </button>
        </nav>
      </header>

      <aside id="settingsDrawer" class="settings-drawer" aria-label="Wind settings" hidden>
        <div class="drawer-heading">
          <div>
            <p class="eyebrow">Live parameters</p>
            <h1>Wind field</h1>
          </div>
          <button
            id="closeSettingsButton"
            class="icon-button icon-button-dark"
            type="button"
            aria-label="Close settings"
            data-tooltip="Close"
          >
            <i data-lucide="x" aria-hidden="true"></i>
          </button>
        </div>

        <div class="settings-scroll">
          <section class="settings-section" aria-labelledby="flowSettingsTitle">
            <h2 id="flowSettingsTitle">Flow</h2>
            <label class="range-control">
              <span>Density</span>
              <output id="densityValue" for="densitySlider">160</output>
              <input id="densitySlider" type="range" min="24" max="480" step="8" value="160" />
            </label>
            <label class="range-control">
              <span>Speed</span>
              <output id="speedValue" for="speedSlider">1.00×</output>
              <input id="speedSlider" type="range" min="0.25" max="2.5" step="0.05" value="1" />
            </label>
            <label class="range-control">
              <span>Gust</span>
              <output id="gustValue" for="gustSlider">5.5 m/s</output>
              <input id="gustSlider" type="range" min="0" max="20" step="0.5" value="5.5" />
            </label>
          </section>

          <section class="settings-section" aria-labelledby="ribbonSettingsTitle">
            <h2 id="ribbonSettingsTitle">Ribbon</h2>
            <label class="range-control">
              <span>Length</span>
              <output id="lengthValue" for="lengthSlider">18.0 m</output>
              <input id="lengthSlider" type="range" min="6" max="42" step="0.5" value="18" />
            </label>
            <label class="range-control">
              <span>Width</span>
              <output id="widthValue" for="widthSlider">1.4 px</output>
              <input id="widthSlider" type="range" min="0.6" max="3.4" step="0.1" value="1.4" />
            </label>
            <label class="range-control">
              <span>Opacity</span>
              <output id="opacityValue" for="opacitySlider">34%</output>
              <input id="opacitySlider" type="range" min="0.08" max="0.72" step="0.01" value="0.34" />
            </label>
          </section>
        </div>
      </aside>

      <section class="telemetry" aria-label="Renderer statistics">
        <div id="backendState" class="backend-state">
          <span class="status-dot"></span>
          <span id="backendLabel">Initializing</span>
        </div>
        <dl>
          <div>
            <dt>FPS</dt>
            <dd id="fpsValue">--</dd>
          </div>
          <div>
            <dt>DRAW</dt>
            <dd id="drawValue">--</dd>
          </div>
          <div>
            <dt>LINES</dt>
            <dd id="lineValue">--</dd>
          </div>
        </dl>
      </section>

      <div class="field-readout" aria-live="polite">
        <span id="fieldIndex">01</span>
        <div>
          <strong id="fieldName">Breeze</strong>
          <span id="fieldMetric">6.8 m/s · uniform</span>
        </div>
      </div>

      <div id="loading" class="loading-screen" role="status" aria-live="polite">
        <div class="loading-mark" aria-hidden="true">
          <span></span><span></span><span></span>
        </div>
        <p>Compiling wind field</p>
      </div>

      <div id="fatalError" class="fatal-error" role="alert" hidden>
        <i data-lucide="triangle-alert" aria-hidden="true"></i>
        <strong>Renderer unavailable</strong>
        <p id="fatalErrorMessage"></p>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
